spring:
  application:
    name: notificacion
  datasource:
    url: jdbc:mysql://localhost:3306/notificaciones?createDatabaseIfNotExist=true
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  main:
    allow-bean-definition-overriding: true
server:
  port: 8086