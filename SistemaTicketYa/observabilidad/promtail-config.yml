# Promtail: descubre los contenedores por el socket de Docker y envía sus logs a Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Etiqueta "servicio" = nombre del servicio en docker-compose (orden, pago, gateway...)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: servicio
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: contenedor
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: proyecto
