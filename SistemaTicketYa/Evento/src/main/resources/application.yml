spring:
  application:
    name: evento
  data:
    mongodb:
      # Mongo del docker-compose de Evento (puerto 27018, usuario root / 1234)
      uri: mongodb://root:1234@localhost:27018/eventos?authSource=admin
      auto-index-creation: true

server:
  port: 8083

servicios:
  entradas:
    url: http://localhost:8085/api/entradas
  usuarios:
    url: http://localhost:8081/api/usuarios
